name: Package human-simple-frontstage

on:
  push:
    branches: [main]
    paths:
      - "skills/human-simple-frontstage/**"
      - ".github/workflows/package-human-simple-frontstage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and package skill
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import zipfile

          skill = Path("skills/human-simple-frontstage")
          skill_md = skill / "SKILL.md"
          agent_yaml = skill / "agents/openai.yaml"

          if not skill_md.is_file():
              raise SystemExit("SKILL.md not found")
          if not agent_yaml.is_file():
              raise SystemExit("agents/openai.yaml not found")

          content = skill_md.read_text(encoding="utf-8")
          match = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
          if not match:
              raise SystemExit("Invalid YAML frontmatter")

          frontmatter = match.group(1)
          name_match = re.search(r"^name:\s*([^\n]+)$", frontmatter, re.MULTILINE)
          description_match = re.search(r"^description:\s*(.+)$", frontmatter, re.MULTILINE)
          if not name_match or not description_match:
              raise SystemExit("Missing name or description")

          name = name_match.group(1).strip()
          description = description_match.group(1).strip()
          if name != "human-simple-frontstage":
              raise SystemExit(f"Unexpected skill name: {name}")
          if not re.fullmatch(r"[a-z0-9-]+", name):
              raise SystemExit("Skill name must be lowercase hyphen-case")
          if len(name) > 64:
              raise SystemExit("Skill name exceeds 64 characters")
          if not description or len(description) > 1024:
              raise SystemExit("Description is missing or too long")
          if "<" in description or ">" in description:
              raise SystemExit("Description contains angle brackets")

          required_refs = {
              "references/examples.md",
              "references/output-formats.md",
              "references/persian-style.md",
              "references/project-integration.md",
              "references/quality-gates.md",
              "references/term-map-fa.md",
          }
          existing = {
              str(path.relative_to(skill))
              for path in skill.rglob("*")
              if path.is_file()
          }
          missing = required_refs - existing
          if missing:
              raise SystemExit(f"Missing required references: {sorted(missing)}")

          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          output = dist / "skill.zip"
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(skill.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(skill.parent))

          if output.stat().st_size > 25 * 1024 * 1024:
              raise SystemExit("skill.zip exceeds 25 MiB")

          print(f"Validated and packaged: {output} ({output.stat().st_size} bytes)")
          PY

      - name: Upload skill.zip
        uses: actions/upload-artifact@v4
        with:
          name: human-simple-frontstage
          path: dist/skill.zip
          if-no-files-found: error
          retention-days: 30
