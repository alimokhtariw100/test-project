name: Package human-simple-frontstage

on:
  workflow_dispatch:
  push:
    paths:
      - "skills/human-simple-frontstage/**"
      - ".github/skill-tools/**"
      - ".github/workflows/package-human-simple-frontstage.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Initialize, validate, and package skill
        run: |
          rm -rf /tmp/human-simple-skill
          mkdir -p /tmp/human-simple-skill
          python .github/skill-tools/init_skill.py human-simple-frontstage --path /tmp/human-simple-skill
          rm -rf /tmp/human-simple-skill/human-simple-frontstage/scripts
          rm -rf /tmp/human-simple-skill/human-simple-frontstage/references
          rm -rf /tmp/human-simple-skill/human-simple-frontstage/assets
          rm -rf /tmp/human-simple-skill/human-simple-frontstage/agents
          cp -a skills/human-simple-frontstage/. /tmp/human-simple-skill/human-simple-frontstage/
          python .github/skill-tools/package_skill.py /tmp/human-simple-skill/human-simple-frontstage "$GITHUB_WORKSPACE/dist"
          test -f dist/skill.zip

      - name: Prepare direct installable artifact
        run: |
          rm -rf artifact
          mkdir -p artifact/human-simple-frontstage
          cp -a /tmp/human-simple-skill/human-simple-frontstage/. artifact/human-simple-frontstage/

      - name: Upload direct skill package
        uses: actions/upload-artifact@v4
        with:
          name: human-simple-frontstage-direct
          path: artifact/
          if-no-files-found: error
          retention-days: 30
