name: Package human-simple-frontstage

on:
  push:
    branches:
      - skill-human-simple-frontstage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: skill-human-simple-frontstage

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --quiet PyYAML

      - name: Initialize clean skill template
        run: |
          rm -rf /tmp/skill-build
          mkdir -p /tmp/skill-build
          python .github/skill-tools/init_skill.py human-simple-frontstage --path /tmp/skill-build

      - name: Replace template with final skill files
        run: |
          rm -rf /tmp/skill-build/human-simple-frontstage
          cp -R human-simple-frontstage /tmp/skill-build/human-simple-frontstage

      - name: Validate and package
        run: |
          rm -rf dist
          mkdir -p dist
          python .github/skill-tools/package_skill.py /tmp/skill-build/human-simple-frontstage dist
          test -f dist/skill.zip
          cp dist/skill.zip skill.zip

      - name: Publish exact skill.zip on the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skill.zip
          if git diff --cached --quiet; then
            echo "skill.zip is already current"
          else
            git commit -m "build(skill): publish validated skill.zip [skip ci]"
            git push origin HEAD:skill-human-simple-frontstage
          fi

      - name: Upload packaged skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: human-simple-frontstage-skill
          path: dist/skill.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish exact skill.zip as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="human-simple-frontstage-v1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/skill.zip --clobber
          else
            gh release create "$TAG" dist/skill.zip \
              --target skill-human-simple-frontstage \
              --title "human-simple-frontstage v1" \
              --notes "Validated Agent Skill package for clear, human, audience-facing Persian copy."
          fi
